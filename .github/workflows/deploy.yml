name: Deploy Portfolio (DEV & PROD)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version or build number changed
        id: version_diff
        run: |
          BEFORE_SHA="${{ github.event.before }}"

          # Fallback to HEAD~1 if before commit doesn't exist (e.g. initial push or empty SHA)
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREV_VER=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          else
            PREV_VER=$(git show "$BEFORE_SHA":pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          fi

          CURR_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')

          echo "Previous version: $PREV_VER"
          echo "Current version:  $CURR_VER"

          if [ -z "$PREV_VER" ] || [ "$PREV_VER" != "$CURR_VER" ]; then
            echo "Version or build number changed! Proceeding with deployment."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version and build number did not change. Skipping deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - run: flutter config --enable-web
      - run: flutter clean
      - run: flutter pub get
      - run: flutter test

      - name: Build DEV
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href="/${{ github.event.repository.name }}/dev/" \
            --dart-define=ENV=dev \
            --dart-define=BUILD_VERSION=${{ github.run_number }}

      - name: Deploy DEV
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: dev
          keep_files: true

  deploy-prod:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - run: flutter config --enable-web
      - run: flutter clean
      - run: flutter pub get
      - run: flutter test

      - name: Build PROD
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href="/${{ github.event.repository.name }}/" \
            --dart-define=ENV=prod \
            --dart-define=BUILD_VERSION=${{ github.run_number }}

      - name: Deploy PROD
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: .
          keep_files: true
