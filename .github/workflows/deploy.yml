name: Deploy Portfolio (DEV & PROD)

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed on this branch
        id: version_diff
        run: |
          BRANCH="${{ github.ref_name }}"
          BEFORE_SHA="${{ github.event.before }}"

          CURR_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          PREV_VER=""

          # 1. Check against the commit this branch pointed to before the push
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            PREV_VER=$(git show "$BEFORE_SHA":pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
          fi

          # 2. Fallback if BEFORE_SHA is not available or empty (e.g. initial push or merge)
          if [ -z "$PREV_VER" ]; then
            # If this is a merge commit (has 2 parents), HEAD^1 is the previous commit of THIS target branch
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              PREV_VER=$(git show HEAD^1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
            else
              PREV_VER=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' | awk '{print $2}' || echo "")
            fi
          fi

          echo "Target Branch: $BRANCH"
          echo "Previous version on $BRANCH: '$PREV_VER'"
          echo "Current version on $BRANCH:  '$CURR_VER'"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch: Proceeding with deployment."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV_VER" ]; then
            echo "No previous version found on $BRANCH: Proceeding with deployment."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PREV_VER" != "$CURR_VER" ]; then
            echo "Version changed on $BRANCH ($PREV_VER -> $CURR_VER): Proceeding with deployment."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version did not change on $BRANCH ($PREV_VER == $CURR_VER): Skipping deployment."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-dev:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - run: flutter config --enable-web
      - run: flutter clean
      - run: flutter pub get
      - run: flutter test

      - name: Build DEV
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href="/${{ github.event.repository.name }}/dev/" \
            --dart-define=ENV=dev \
            --dart-define=BUILD_VERSION=${{ github.run_number }}

      - name: Deploy DEV
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: dev
          keep_files: true

  deploy-prod:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - run: flutter config --enable-web
      - run: flutter clean
      - run: flutter pub get
      - run: flutter test

      - name: Build PROD
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href="/${{ github.event.repository.name }}/" \
            --dart-define=ENV=prod \
            --dart-define=BUILD_VERSION=${{ github.run_number }}

      - name: Deploy PROD
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: .
          keep_files: true
